<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
  <!-- Open Ring. A menu bar icon is a template image: the system tints it and
       inverts it when the menu is open, so this is pure silhouette — no colour,
       no gradient, no glass. The gap keeps it from reading as a filled blob at
       18pt, which is what kills most ring marks in the menu bar. -->
  <path d="M 5.75 3.371 A 6.5 6.5 0 1 1 12.25 3.371"
        fill="none" stroke="black" stroke-width="1.6" stroke-linecap="round"/>
</svg>
